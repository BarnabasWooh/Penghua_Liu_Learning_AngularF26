<div class="container">

@for (book of bookList(); track book.id; let evenRow = $even) {
  <app-book-list-item
    [item]="book"
    (actionEmitter)="onChildAction($event)"
    [isEven]="evenRow" />
} @empty {
  <p>No books now.</p>
}

  <h3>Books with Description</h3>

  @for (book of booksWithDescription(); track book.id){
    <p>{{book.name}}</p>
  }

  <p>{{ booksWithDescriptionCount()}} books have descriptions.</p>

  <p>{{ fantasyBookCount() }} Fantasy books.</p>

</div>
