@if (book(); as selectedBook) {
  <h2 appHighlight = '#DEEBFF'>{{ selectedBook.name }}</h2>
  <p>{{ selectedBook.author | authorLabel }}</p>
  <p>category: {{ selectedBook.category }}</p>

  <!-- Toggle the saved state of the selected book. -->
  <button type="button" (click)="savedService.toggle(String(selectedBook.id))">
    {{ savedService.isSaved(String(selectedBook.id)) ? 'Unsave' : 'Save' }}
  </button>
} @else {
  <p>Book not found.</p>
}
